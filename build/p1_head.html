<title>Ledger Broker CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#060A14;--bg2:#0B1222;--surface:rgba(15,22,40,.72);--surface2:rgba(255,255,255,.035);--surface-solid:#0F1628;
  --ink:#E9EFFB;--ink2:#C2CCE0;--muted:#8592AE;
  --line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.26);
  --accent:#22D3EE;--accent2:#8B5CF6;--accent3:#F5C451;
  --primary:#22D3EE;--primary-ink:#04101C;--primary-soft:rgba(34,211,238,.10);
  --gold:#F5C451;--gold-soft:rgba(245,196,81,.12);
  --ok:#34D399;--ok-soft:rgba(52,211,153,.12);--bad:#F87171;--bad-soft:rgba(248,113,113,.12);--warn:#FBBF24;--warn-soft:rgba(251,191,36,.12);--info:#60A5FA;--info-soft:rgba(96,165,250,.12);
  --rail:rgba(8,12,24,.75);--rail-ink:#B8C4DC;--rail-muted:#7A88A6;--rail-active:#FFFFFF;--rail-hover:rgba(255,255,255,.05);
  --glow:0 0 0 1px rgba(34,211,238,.18),0 0 32px rgba(34,211,238,.18);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --radius:14px;--font:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --blur:blur(18px) saturate(140%);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EEF2FA;--bg2:#F6F8FD;--surface:rgba(255,255,255,.78);--surface2:rgba(15,23,42,.035);--surface-solid:#FFFFFF;
  --ink:#0F172A;--ink2:#334155;--muted:#64748B;
  --line:rgba(15,23,42,.09);--line2:rgba(15,23,42,.18);
  --accent:#0891B2;--accent2:#7C3AED;--accent3:#B8860B;
  --primary:#0891B2;--primary-ink:#FFFFFF;--primary-soft:rgba(8,145,178,.10);
  --gold:#B8860B;--gold-soft:rgba(184,134,11,.12);
  --ok:#059669;--ok-soft:rgba(5,150,105,.12);--bad:#DC2626;--bad-soft:rgba(220,38,38,.10);--warn:#B45309;--warn-soft:rgba(180,83,9,.12);--info:#2563EB;--info-soft:rgba(37,99,235,.10);
  --rail:rgba(10,15,30,.92);--rail-ink:#B8C4DC;--rail-muted:#7A88A6;--rail-active:#FFFFFF;--rail-hover:rgba(255,255,255,.06);
  --glow:0 0 0 1px rgba(8,145,178,.18),0 0 28px rgba(8,145,178,.14);
  --shadow:0 1px 2px rgba(15,23,42,.06),0 10px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.muted{color:var(--muted)}
.small{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(34,211,238,.3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Ambient layers ---------- */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 600px at 8% -10%,rgba(139,92,246,.22),transparent 60%),
  radial-gradient(800px 500px at 100% 0%,rgba(34,211,238,.16),transparent 60%),
  radial-gradient(700px 500px at 60% 110%,rgba(245,196,81,.10),transparent 60%);
  animation:meshdrift 22s ease-in-out infinite alternate}
:root[data-theme="light"] .mesh{opacity:.55}
@keyframes meshdrift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-2%,1.5%,0) scale(1.06)}}
.scanline{position:fixed;left:0;right:0;top:0;height:2px;z-index:90;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);transform:scaleX(0);transform-origin:left;opacity:0}
.scanline.go{animation:scan .7s ease-out}
@keyframes scan{0%{transform:scaleX(0);opacity:1}80%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:252px 1fr;height:100%;min-height:100vh;position:relative;z-index:1}
.app.collapsed{grid-template-columns:68px 1fr}
.rail{background:var(--rail);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--rail-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;border-right:1px solid var(--line)}
.rail::after{content:"";position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(34,211,238,.5),rgba(139,92,246,.5),transparent)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.brand .mark{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 210deg,var(--accent),var(--accent2),var(--accent3),var(--accent));display:grid;place-items:center;color:#04101C;font-weight:700;font-family:var(--mono);flex:none;box-shadow:0 0 22px rgba(34,211,238,.35);animation:spin 14s linear infinite}
.brand .mark span{background:var(--surface-solid);color:var(--ink);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.brand .name{font-weight:600;color:#fff;line-height:1.1}
.brand .name small{display:block;font-weight:400;color:var(--rail-muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.nav{overflow-y:auto;flex:1;padding:8px 0 24px;scrollbar-width:thin}
.nav-group{margin:2px 8px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:transparent;color:var(--rail-ink);border-radius:9px;cursor:pointer;text-align:left;font-size:13px;position:relative;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--rail-hover);color:#fff}
.nav-btn .ico{width:18px;height:18px;flex:none;opacity:.85}
.nav-btn .chev{margin-left:auto;width:14px;height:14px;transition:transform .15s;opacity:.6}
.nav-group.open .nav-btn .chev{transform:rotate(90deg)}
.nav-btn.active{color:var(--rail-active);background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(139,92,246,.06) 70%,transparent)}
.nav-btn.active .ico{color:var(--accent);filter:drop-shadow(0 0 6px rgba(34,211,238,.7))}
.nav-btn.active::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--accent)}
.nav-sub{display:none;padding:2px 0 4px 26px}
.nav-group.open .nav-sub{display:block}
.nav-sub button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--rail-muted);padding:6px 10px;border-radius:7px;cursor:pointer;font-size:12.5px}
.nav-sub button:hover{color:#fff;background:var(--rail-hover)}
.nav-sub button.active{color:var(--accent)}
.nav .badge{margin-left:auto;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04101C;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px;font-family:var(--mono)}
.nav-sub button .badge{float:right;margin-top:1px}
.app.collapsed .brand .name,.app.collapsed .nav-btn span,.app.collapsed .nav-btn .chev,.app.collapsed .nav-sub,.app.collapsed .nav .badge{display:none}
.app.collapsed .nav-btn{justify-content:center}
.app.collapsed .brand{justify-content:center;padding:16px 8px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--rail);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 20px;min-height:58px}
.iconbtn{width:36px;height:36px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);position:relative;transition:box-shadow .2s,border-color .2s}
.iconbtn:hover{border-color:var(--accent);box-shadow:var(--glow);color:var(--ink)}
.iconbtn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:0 12px;height:36px;color:var(--muted);cursor:text;transition:box-shadow .2s,border-color .2s}
.search:hover{border-color:var(--accent);box-shadow:var(--glow)}
.search input{border:0;background:transparent;flex:1;outline:none;color:var(--ink);min-width:0}
.search kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:5px;padding:0 6px;color:var(--muted)}
.chip-select{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;height:36px;padding:0 10px;font-size:12.5px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.chip-select select{border:0;background:transparent;outline:none;cursor:pointer;max-width:170px;color:var(--ink)}
.chip-select option{color:#0F172A}
.user{display:flex;align-items:center;gap:8px;margin-left:auto;padding-left:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04101C;display:grid;place-items:center;font-weight:700;font-size:12.5px;box-shadow:0 0 16px rgba(139,92,246,.4)}
.user .who{line-height:1.15}.user .who b{display:block;font-weight:600;font-size:12.5px}.user .who span{font-size:11px;color:var(--muted)}
.ai-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:linear-gradient(var(--surface-solid),var(--surface-solid)) padding-box,linear-gradient(135deg,var(--accent),var(--accent2)) border-box;color:var(--ink);cursor:pointer;font-weight:600;font-size:12.5px;position:relative;overflow:hidden}
.ai-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(34,211,238,.25),transparent 70%);transform:translateX(-120%);animation:sheen 4s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.ai-btn .orb{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--accent) 45%,var(--accent2));box-shadow:0 0 12px var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

.content{padding:22px 22px 80px;display:flex;flex-direction:column;gap:16px;max-width:1640px;width:100%;position:relative}
.content>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.content>*:nth-child(2){animation-delay:.04s}.content>*:nth-child(3){animation-delay:.08s}.content>*:nth-child(4){animation-delay:.12s}.content>*:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.crumbs{font-size:11.5px;color:var(--muted);margin-bottom:4px;display:flex;gap:6px;align-items:center;letter-spacing:.04em;text-transform:uppercase}
.crumbs .sep{opacity:.5}
.page-head h1{font-size:24px;font-weight:600;background:linear-gradient(90deg,var(--ink),var(--ink2));-webkit-background-clip:text;background-clip:text}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:72ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Cards, buttons, pills ---------- */
.card{min-width:0;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(34,211,238,.35),transparent 40%,transparent 60%,rgba(139,92,246,.35));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.5}
.card:hover{border-color:var(--line2)}
.card.tilt{will-change:transform}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:13.5px;font-weight:600}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);border-radius:9px;padding:0 12px;height:34px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:box-shadow .2s,border-color .2s,transform .1s}
.btn:hover{border-color:var(--accent);box-shadow:var(--glow)}
.btn:active{transform:translateY(1px)}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn.xs{height:24px;padding:0 8px;font-size:11.5px;border-radius:6px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04101C;border-color:transparent;font-weight:600;box-shadow:0 6px 20px rgba(34,211,238,.25)}
:root[data-theme="light"] .btn.primary{color:#fff}
.btn.primary:hover{filter:brightness(1.1);box-shadow:0 8px 28px rgba(139,92,246,.35)}
.btn.ok{background:var(--ok);border-color:transparent;color:#04101C}
.btn.bad{background:var(--bad);border-color:transparent;color:#fff}
.btn.ghost-bad{color:var(--bad);border-color:rgba(248,113,113,.3);background:var(--bad-soft)}
.btn.ghost-ok{color:var(--ok);border-color:rgba(52,211,153,.3);background:var(--ok-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap;border:1px solid transparent;letter-spacing:.01em}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:rgba(52,211,153,.25)}.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:rgba(248,113,113,.25)}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(251,191,36,.25)}.pill.info{background:var(--info-soft);color:var(--info);border-color:rgba(96,165,250,.25)}.pill.neutral{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.tag{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;font-family:var(--mono);color:var(--ink2);margin:1px 2px 1px 0;white-space:nowrap}
.tag.gold{background:var(--gold-soft);border-color:rgba(245,196,81,.3);color:var(--gold)}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.amt.cr{color:var(--ok)}.amt.dr{color:var(--bad)}

/* ---------- KPI ---------- */
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.18),transparent 70%);pointer-events:none}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.kpi .v{font-size:26px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1;text-shadow:0 0 18px rgba(34,211,238,.25)}
.kpi .d{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.kpi .d .up{color:var(--ok)}.kpi .d .down{color:var(--bad)}
.kpi.attn{border-color:rgba(251,191,36,.45)}.kpi.attn::after{background:radial-gradient(circle,rgba(251,191,36,.22),transparent 70%)}
.kpi.attn .v{color:var(--warn);text-shadow:0 0 18px rgba(251,191,36,.35)}
.kpi.crit{border-color:rgba(248,113,113,.5)}.kpi.crit::after{background:radial-gradient(circle,rgba(248,113,113,.25),transparent 70%)}
.kpi.crit .v{color:var(--bad);text-shadow:0 0 18px rgba(248,113,113,.4)}

/* ---------- AI insights ---------- */
.insights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.insight{position:relative;border-radius:14px;padding:14px 16px 14px 18px;background:var(--surface);backdrop-filter:var(--blur);border:1px solid transparent;background-clip:padding-box;overflow:hidden;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .2s}
.insight::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(120deg,var(--accent),var(--accent2),var(--accent3),var(--accent));background-size:300% 300%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:borderflow 6s linear infinite;pointer-events:none;opacity:.8}
@keyframes borderflow{to{background-position:300% 0}}
.insight:hover{transform:translateY(-2px)}
.insight .ih{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.insight .ih .orb{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--accent) 45%,var(--accent2));box-shadow:0 0 10px var(--accent);animation:pulse 2.4s ease-in-out infinite}
.insight .it{font-size:13.5px;font-weight:600}
.insight .ib{font-size:12.5px;color:var(--muted)}
.insight .ia{margin-top:4px;font-size:12px;color:var(--accent);font-weight:600}
.insight.sev-bad .ih{color:var(--bad)}.insight.sev-bad .ih .orb{background:radial-gradient(circle at 35% 35%,#fff,var(--bad) 45%,#7f1d1d);box-shadow:0 0 10px var(--bad)}.insight.sev-bad::before{background:linear-gradient(120deg,var(--bad),var(--accent2),var(--bad));background-size:300% 300%}
.insight.sev-warn .ih{color:var(--warn)}.insight.sev-warn .ih .orb{background:radial-gradient(circle at 35% 35%,#fff,var(--warn) 45%,#78350f);box-shadow:0 0 10px var(--warn)}.insight.sev-warn::before{background:linear-gradient(120deg,var(--warn),var(--accent3),var(--warn));background-size:300% 300%}
.ring{--p:0;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::after{content:attr(data-v);position:absolute;inset:4px;border-radius:50%;background:var(--surface-solid);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink)}
.ring.lg{width:60px;height:60px}.ring.lg::after{inset:6px;font-size:15px}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:0 0 var(--radius) var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--surface-solid);color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th .sort{opacity:.35;margin-left:3px}
.tbl th.sorted .sort{opacity:1;color:var(--accent)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--primary-soft);box-shadow:inset 2px 0 0 var(--accent)}
.tbl tr.sel{background:var(--gold-soft)}
.tbl .who{line-height:1.2}.tbl .who b{font-weight:500;display:block}.tbl .who span{font-size:11.5px;color:var(--muted)}
.tbl .row-actions{display:flex;gap:4px;justify-content:flex-end}
.tbl .empty{text-align:center;padding:34px;color:var(--muted)}
.tbl img.thumb{width:36px;height:26px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .sp{flex:1}
.toolbar input,.toolbar select{height:30px;border:1px solid var(--line2);border-radius:8px;padding:0 8px;background:var(--surface2);font-size:12.5px;min-width:0;color:var(--ink)}
